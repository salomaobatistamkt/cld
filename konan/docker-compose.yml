name: konan

services:
  # Cérebro: llama.cpp rodando o Qwen no processador (sem GPU).
  cerebro:
    image: ghcr.io/ggml-org/llama.cpp:server
    restart: unless-stopped
    environment:
      LLAMA_CACHE: /modelos
    command:
      - -hf
      - ${MODELO:-unsloth/Qwen3-4B-Instruct-2507-GGUF:Q4_K_M}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - ${CONTEXTO:-4096}
      - --cache-type-k
      - q8_0
      - --threads
      - ${THREADS:-4}
      - --parallel
      - "1"
      - --jinja
    volumes:
      - modelos-cerebro:/modelos
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15m   # na primeira vez baixa o modelo (~2,5 GB)

  # Voz: escuta o nome, transcreve, conversa, lembra e fala.
  voz:
    build: ./voz
    restart: unless-stopped
    depends_on:
      cerebro:
        condition: service_healthy
    devices:
      - /dev/snd:/dev/snd
    group_add:
      - audio
    environment:
      CEREBRO_URL: http://cerebro:8080
      KONAN_NOME: ${KONAN_NOME:-Konan}
      ALSA_CARD: ${ALSA_CARD:-0}
      WHISPER_MODELO: ${WHISPER_MODELO:-base}
      VOZ_MOTOR: ${VOZ_MOTOR:-kokoro}
      VOZ_KOKORO: ${VOZ_KOKORO:-pf_dora}
      VOZ_VELOCIDADE: ${VOZ_VELOCIDADE:-1.0}
      INTERFACE_ATIVA: ${INTERFACE_ATIVA:-1}
      INTERFACE_URL: ${INTERFACE_URL:-}
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "${INTERFACE_PORTA:-8090}:8090"
    volumes:
      - dados:/data

volumes:
  modelos-cerebro:
  dados:
