<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05070d">
<title>Konan</title>
<style>
  :root { --fundo:#05070d; --cor:#5ab4ff; --cor2:#7b5cff; --texto:#cfe3ff; }
  * { box-sizing:border-box; margin:0; }
  body { background:radial-gradient(circle at 50% 40%, #0c1426 0%, var(--fundo) 70%); color:var(--texto);
         font-family:system-ui, sans-serif; min-height:100vh; display:flex; flex-direction:column;
         align-items:center; justify-content:center; gap:40px; padding:16px; overflow:hidden;
         -webkit-user-select:none; user-select:none; }
  .nucleo { position:relative; width:min(60vw,280px); aspect-ratio:1; }
  .anel, .esfera { position:absolute; inset:0; border-radius:50%; }
  .anel { border:1px solid color-mix(in srgb, var(--cor) 40%, transparent); animation:girar 18s linear infinite; }
  .anel:nth-child(2) { inset:-10%; border-style:dashed; animation-duration:30s; animation-direction:reverse; opacity:.5; }
  .anel:nth-child(3) { inset:-22%; opacity:.25; animation-duration:45s; }
  .esfera { inset:18%; background:radial-gradient(circle at 40% 35%, #fff 0%, var(--cor) 25%, var(--cor2) 60%, transparent 72%);
            filter:blur(2px); box-shadow:0 0 80px var(--cor), 0 0 160px var(--cor2); transition:opacity .3s;
            animation:respirar 4s ease-in-out infinite; opacity:.55; }
  body[data-estado="ouvindo"] .esfera { opacity:1; animation-duration:1.2s; }
  body[data-estado="pensando"] .esfera { opacity:.9; animation:pensar .8s ease-in-out infinite; --cor:#b07bff; }
  body[data-estado="falando"] .esfera { opacity:1; animation:falar .35s ease-in-out infinite alternate; }
  body[data-estado="erro"] { --cor:#ff5a6e; --cor2:#a0203a; }
  .estado { font-size:12px; letter-spacing:.35em; text-transform:uppercase; opacity:.6; text-align:center; }
  .legenda { max-width:640px; text-align:center; font-size:clamp(16px,2.4vw,22px); line-height:1.5; min-height:3em; }
  .legenda .quem { display:block; font-size:11px; letter-spacing:.3em; opacity:.5; margin-bottom:6px; text-transform:uppercase; }
  .botoes { display:none; gap:12px; flex-wrap:wrap; justify-content:center; }
  body.web .botoes { display:flex; }
  button { font:inherit; color:inherit; background:#0c1426; border:1px solid #2a4a7a; border-radius:999px;
           padding:14px 22px; cursor:pointer; touch-action:none; }
  button:active, button.ativo { background:#2a5bd7; border-color:#2a5bd7; }
  .iniciar { position:fixed; inset:0; display:none; align-items:center; justify-content:center; flex-direction:column;
             gap:16px; background:rgba(5,7,13,.92); z-index:2; text-align:center; padding:16px; }
  body.web.parado .iniciar { display:flex; }
  .iniciar p { opacity:.7; max-width:360px; line-height:1.5; }
  @keyframes girar { to { transform:rotate(360deg); } }
  @keyframes respirar { 50% { transform:scale(1.06); } }
  @keyframes pensar { 50% { transform:scale(.9) rotate(20deg); } }
  @keyframes falar { from { transform:scale(.97); } to { transform:scale(1.12); } }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
</style>
</head>
<body data-estado="iniciando">
  <div class="iniciar">
    <button id="comecar">Ativar a Konan</button>
    <p>Ela vai usar o microfone e o som deste aparelho. Deixe a página aberta e a tela ligada.
       Diga <b>“Konan”</b> para chamar, ou segure o botão para falar sem dizer o nome.</p>
  </div>
  <div class="nucleo"><div class="anel"></div><div class="anel"></div><div class="anel"></div><div class="esfera"></div></div>
  <div class="estado" id="estado">iniciando</div>
  <p class="legenda" id="legenda"></p>
  <div class="botoes"><button id="segurar">Segure para falar</button><button id="mudo">Pausar</button></div>
<script>
const NOMES = { iniciando:"iniciando", dormindo:"diga “Konan”", continuando:"pode continuar", ouvindo:"ouvindo",
                pensando:"pensando", falando:"falando", erro:"erro", pausada:"pausada" };
const $ = (id) => document.getElementById(id);
function mostrar(estado, texto, quem) {
  document.body.dataset.estado = estado;
  $("estado").textContent = NOMES[estado] || estado;
  if (texto) {
    const l = $("legenda"); l.innerHTML = "";
    const q = document.createElement("span"); q.className = "quem"; q.textContent = quem || "";
    l.append(q, document.createTextNode(texto));
  }
}

// ---------- modo local: só acompanha o que acontece no PC ----------
function acompanhar() {
  const fonte = new EventSource("/eventos");
  fonte.onmessage = (e) => { const d = JSON.parse(e.data); mostrar(d.estado, d.texto, d.quem); };
  fonte.onerror = () => { fonte.close(); mostrar("erro"); $("estado").textContent = "reconectando"; setTimeout(acompanhar, 3000); };
}

// ---------- modo web: microfone e som deste aparelho ----------
let cfg = {}, ctx, ocupada = false, pausada = false, continuarAte = 0, segurando = false, travaTela = null;
const TAXA = 16000;

function paraWav(amostras) {
  const buf = new ArrayBuffer(44 + amostras.length * 2), v = new DataView(buf);
  const txt = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  txt(0, "RIFF"); v.setUint32(4, 36 + amostras.length * 2, true); txt(8, "WAVE"); txt(12, "fmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, TAXA, true);
  v.setUint32(28, TAXA * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); txt(36, "data");
  v.setUint32(40, amostras.length * 2, true);
  for (let i = 0; i < amostras.length; i++) v.setInt16(44 + i * 2, Math.max(-1, Math.min(1, amostras[i])) * 32767, true);
  return new Blob([buf], { type: "audio/wav" });
}

function reamostrar(entrada, taxaOrigem) {
  const razao = taxaOrigem / TAXA, n = Math.floor(entrada.length / razao), saida = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const ini = Math.floor(i * razao), fim = Math.min(entrada.length, Math.floor((i + 1) * razao));
    let soma = 0; for (let j = ini; j < fim; j++) soma += entrada[j];
    saida[i] = soma / Math.max(1, fim - ini);
  }
  return saida;
}

function juntar(pedacos) {
  const total = pedacos.reduce((s, p) => s + p.length, 0), out = new Float32Array(total);
  let o = 0; for (const p of pedacos) { out.set(p, o); o += p.length; }
  return out;
}

const fila = [];
let tocando = false;
function vozPtBr() {
  const vozes = speechSynthesis.getVoices().filter(v => /pt[-_]BR/i.test(v.lang));
  return vozes.find(v => /francisca|luciana|maria|female|feminina|google/i.test(v.name)) || vozes[0];
}
function tocarUm(item) {
  return new Promise((ok) => {
    if (item.audio) {
      const a = new Audio("data:audio/wav;base64," + item.audio);
      a.onended = a.onerror = ok; a.play().catch(ok);
    } else {
      const u = new SpeechSynthesisUtterance(item.texto);
      u.lang = "pt-BR"; u.rate = cfg.velocidade || 1; const v = vozPtBr(); if (v) u.voice = v;
      u.onend = u.onerror = ok; speechSynthesis.speak(u);
    }
  });
}
async function tocarFila() {
  if (tocando) return; tocando = true;
  while (fila.length) { const item = fila.shift(); mostrar("falando", item.texto, cfg.nome); await tocarUm(item); }
  tocando = false;
}

async function enviar(amostras, direto) {
  ocupada = true; mostrar("pensando");
  let respondeu = false;
  try {
    const resp = await fetch("/ouvir", { method: "POST", body: paraWav(amostras),
      headers: { "Content-Type": "audio/wav", "X-Konan-Direto": direto ? "1" : "0" } });
    if (resp.status === 401) { location.reload(); return; }
    if (!resp.ok) throw new Error(await resp.text());
    const leitor = resp.body.getReader(), dec = new TextDecoder(); let resto = "";
    for (;;) {
      const { value, done } = await leitor.read(); if (done) break;
      resto += dec.decode(value, { stream: true });
      let i; while ((i = resto.indexOf("\n")) >= 0) {
        const linha = resto.slice(0, i); resto = resto.slice(i + 1); if (!linha.trim()) continue;
        const d = JSON.parse(linha);
        if (d.tipo === "frase" || d.tipo === "erro") { respondeu = true; fila.push(d); tocarFila(); }
        else if (d.tipo === "ouvi" && d.texto && direto) mostrar("pensando", d.texto, "você");
      }
    }
    while (tocando || fila.length) await new Promise(r => setTimeout(r, 100));
  } catch (e) {
    console.error(e); mostrar("erro", "Não consegui falar com o servidor.", cfg.nome);
    await new Promise(r => setTimeout(r, 1500));
  } finally {
    ocupada = false;
    if (respondeu) continuarAte = Date.now() + cfg.janela * 1000;
    descansar();
  }
}

function descansar() {
  if (pausada) return mostrar("pausada");
  mostrar(Date.now() < continuarAte ? "continuando" : "dormindo");
}

async function iniciarWeb() {
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  await ctx.resume();
  speechSynthesis.speak(new SpeechSynthesisUtterance(""));  // libera a voz no celular
  const stream = await navigator.mediaDevices.getUserMedia({ audio: {
    echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 } });
  const fonte = ctx.createMediaStreamSource(stream);
  const proc = ctx.createScriptProcessor(4096, 1, 1);
  const msPorBloco = 4096 / ctx.sampleRate * 1000;
  let ruido = 0.01, acima = 0, falando = false, silencioMs = 0, pedacos = [], antes = [], gravado = [];

  proc.onaudioprocess = (e) => {
    const bloco = reamostrar(e.inputBuffer.getChannelData(0), ctx.sampleRate);
    if (segurando) { gravado.push(bloco); return; }
    if (ocupada || pausada) { falando = false; pedacos = []; antes = []; acima = 0; return; }
    let soma = 0; for (const s of bloco) soma += s * s;
    const rms = Math.sqrt(soma / bloco.length), limiar = Math.max(0.015, ruido * 3);
    if (!falando) {
      ruido = ruido * 0.95 + Math.min(rms, 0.2) * 0.05;
      antes.push(bloco); if (antes.length > 4) antes.shift();
      acima = rms > limiar ? acima + 1 : 0;
      if (acima >= 2) { falando = true; pedacos = antes.slice(); antes = []; silencioMs = 0; mostrar("ouvindo"); }
      if (document.body.dataset.estado === "continuando" && Date.now() > continuarAte) descansar();
      return;
    }
    pedacos.push(bloco);
    silencioMs = rms > limiar * 0.7 ? 0 : silencioMs + msPorBloco;
    const duracao = pedacos.length * msPorBloco;
    if (silencioMs >= 800 || duracao >= 15000) {
      falando = false;
      const fala = juntar(pedacos); pedacos = [];
      if (duracao - silencioMs >= 300) enviar(fala, Date.now() < continuarAte);
      else descansar();
    }
  };
  fonte.connect(proc); proc.connect(ctx.destination);

  const btn = $("segurar");
  const comecar = (e) => { e.preventDefault(); if (ocupada) return; segurando = true; gravado = []; btn.classList.add("ativo"); mostrar("ouvindo"); };
  const soltar = () => {
    if (!segurando) return; segurando = false; btn.classList.remove("ativo");
    const fala = juntar(gravado); gravado = [];
    if (fala.length > TAXA * 0.3) enviar(fala, true); else descansar();
  };
  btn.addEventListener("pointerdown", comecar);
  ["pointerup", "pointerleave", "pointercancel"].forEach(ev => btn.addEventListener(ev, soltar));
  $("mudo").onclick = () => { pausada = !pausada; $("mudo").textContent = pausada ? "Retomar" : "Pausar"; descansar(); };

  try { travaTela = await navigator.wakeLock?.request("screen"); } catch (_) {}
  document.addEventListener("visibilitychange", async () => {
    if (document.visibilityState === "visible") { try { travaTela = await navigator.wakeLock?.request("screen"); } catch (_) {} ctx.resume(); }
  });
  document.body.classList.remove("parado");
  descansar();
}

(async () => {
  try { cfg = await (await fetch("/config")).json(); } catch (_) { cfg = { modo: "local" }; }
  if (cfg.modo !== "web") return acompanhar();
  document.body.classList.add("web", "parado");
  mostrar("pausada");
  $("comecar").onclick = () => iniciarWeb().catch((e) => {
    console.error(e); mostrar("erro", "Não consegui acessar o microfone. Permita o microfone para este site.", "aviso");
  });
})();
</script>
</body>
</html>
